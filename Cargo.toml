[workspace]
resolver = "2"
members = [
    "crates/agenda-core",
    "crates/agenda-render",
    "crates/agenda-images",
    "crates/agenda-pdf",
    "crates/agenda-pipeline",
    "apps/marius-agenda",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["jkehlDev"]
repository = "https://github.com/jkehlDev/marius-agenda-v2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
